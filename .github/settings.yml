# Repository settings for reactive-bible
# Requires the Probot Settings app: https://probot.github.io/apps/settings/
# Or configure manually in GitHub UI: Settings > General > Pull Requests

repository:
  # Repository name
  name: reactive-bible
  
  # Description
  description: >-
    React TypeScript frontend for Bible reading and study
    application
  
  # Homepage URL (Vercel deployment)
  homepage: https://bibleresearch.vercel.app
  
  # Repository visibility (public or private)
  private: false
  
  # Enable/disable features
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  
  # Default branch
  default_branch: main
  
  # Allow merge commits, squash, and rebase
  allow_merge_commit: true
  allow_squash_merge: true
  allow_rebase_merge: true
  
  # Automatically delete head branches after PR merge
  delete_branch_on_merge: true
  
  # Enable automated security fixes
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# Branch protection rules
branches:
  - name: main
    protection:
      # Require pull request reviews before merging
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      
      # Require status checks to pass before merging
      required_status_checks:
        strict: true
        # `test` runs on every push; `staging-first` is the
        # staging-first gate — see
        # workflows/require-staging.yml and AGENTS.md.
        contexts:
          - test
          - staging-first
      
      # Enforce restrictions for administrators
      enforce_admins: false
      
      # Require linear history
      required_linear_history: false
      
      # Allow force pushes
      allow_force_pushes: false
      
      # Allow deletions
      allow_deletions: false
  
  # Integration branch for the staging-first workflow —
  # see AGENTS.md "Git workflow — staging-first". PRs
  # squash-merge here on green; the post-release reset
  # force-pushes it back to `main`.
  - name: staging
    protection:
      required_pull_request_reviews: null
      required_status_checks:
        strict: false
        contexts:
          - test
      enforce_admins: false
      required_linear_history: false
      # Force pushes stay allowed for the post-release
      # `staging` reset (admin-only via the non-default
      # branch ruleset's bypass).
      allow_force_pushes: true
      allow_deletions: false

# Repository settings for reactive-bible
# Requires the Probot Settings app: https://probot.github.io/apps/settings/
# Or configure manually in GitHub UI: Settings > General > Pull Requests

repository:
  # Repository name
  name: reactive-bible
  
  # Description
  description: React TypeScript frontend for Bible reading and study application
  
  # Homepage URL (Vercel deployment)
  homepage: https://reactive-bible.vercel.app
  
  # Repository visibility (public or private)
  private: false
  
  # Enable/disable features
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  
  # Default branch
  default_branch: main
  
  # Allow merge commits, squash, and rebase
  allow_merge_commit: true
  allow_squash_merge: true
  allow_rebase_merge: true
  
  # Automatically delete head branches after PR merge
  delete_branch_on_merge: true
  
  # Enable automated security fixes
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# Branch protection rules
branches:
  - name: main
    protection:
      # Require pull request reviews before merging
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      
      # Require status checks to pass before merging
      required_status_checks:
        strict: true
        contexts: []
      
      # Enforce restrictions for administrators
      enforce_admins: false
      
      # Require linear history
      required_linear_history: false
      
      # Allow force pushes
      allow_force_pushes: false
      
      # Allow deletions
      allow_deletions: false

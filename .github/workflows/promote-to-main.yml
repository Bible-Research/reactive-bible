name: Promote to main

# Manual release train for the staging-first workflow. For
# every branch already merged into `staging` whose head is
# not yet in `main` (the same association check the
# `staging-first` gate uses), open a promotion PR to `main`
# with the original title + body, squash-merge it, then
# reset `staging` to `main`.
#
# Conflicts are resolved deterministically, not by an AI:
# the staging squash commit's tree already holds the feature
# integrated with everything promoted before it, so
# conflicting paths are checked out from that tree — the
# exact state staging validated. See AGENTS.md
# "Git workflow — staging-first".
#
# Needs an admin PAT in AUTOMERGE_TOKEN (same secret the
# dependabot automerge uses): the merges bypass `main`'s
# review ruleset, and the staging reset bypasses the
# non-fast-forward ruleset. With plain GITHUB_TOKEN the
# merges will fail — that's a signal to configure the PAT.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List pending promotions, merge nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Promote staged branches to main
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          echo "### Promote-to-main run" > "$GITHUB_STEP_SUMMARY"

          # Latest merged staging PR per head branch, in
          # staging-merge order — promotion follows that order
          # so each squash commit's tree only ever holds
          # already-promoted features plus its own.
          gh pr list --repo "$REPO" --state merged \
            --base staging --limit 200 \
            --json number,title,body,headRefName,headRefOid,mergedAt \
            --jq 'sort_by(.mergedAt)
                  | group_by(.headRefName) | map(.[-1])
                  | sort_by(.mergedAt)' > /tmp/staged.json
          echo "== $(jq length /tmp/staged.json) staged branch(es)"

          promoted=0; skipped=0; replayed=0; failed=0
          while read -r row; do
            field() { base64 -d <<<"$row" | jq -r "$1"; }
            sha=$(field .headRefOid)
            branch=$(field .headRefName)
            spr=$(field .number)
            title=$(field .title)

            # Already promoted? The same lookup the
            # staging-first gate performs.
            in_main=$(gh api -X GET \
              "repos/$REPO/commits/$sha/pulls" -f per_page=100 \
              --jq '[.[] | select(.merged_at != null and
                     .base.ref == "main")] | length')
            if [ "$in_main" -gt 0 ]; then
              echo "skip: '$title' already in main"
              echo "- \`$title\` — already in main" \
                >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped+1)); continue
            fi
            echo "== promoting #$spr '$title' ($branch @ ${sha::7})"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- \`$title\` — pending" \
                >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Recreate the head branch via the refs API: no
            # push event fires, so no CI re-run — the SHA's
            # existing green `test` run satisfies the required
            # check instantly.
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$sha" \
              > /dev/null 2>&1 || true

            field '.body // ""' > /tmp/body.md
            {
              cat /tmp/body.md
              printf '\n---\n_Promoted from `staging` (PR '
              printf '#%s) by the Promote-to-main workflow._\n' \
                "$spr"
            } > /tmp/promo-body.md
            mpr=$(gh pr create --repo "$REPO" --base main \
              --head "$branch" --title "$title" \
              --body-file /tmp/promo-body.md 2>/dev/null) || \
            mpr=$(gh pr list --repo "$REPO" --state open \
              --base main --head "$branch" \
              --json url --jq '.[0].url')
            if [ -z "$mpr" ]; then
              echo "  !! could not open a main PR"
              failed=$((failed+1)); continue
            fi
            echo "  main PR: $mpr"

            # mergeable settles async; staging-first re-runs on
            # PR open and passes by construction.
            mergeable=""
            for _ in $(seq 1 24); do
              mergeable=$(gh pr view "$mpr" --json mergeable \
                -q .mergeable)
              [ "$mergeable" != "UNKNOWN" ] && break
              sleep 5
            done
            echo "  mergeable=$mergeable"
            if [ "$mergeable" = "MERGEABLE" ] && \
               gh pr merge "$mpr" --squash --admin; then
              promoted=$((promoted+1))
              echo "- \`$title\` — promoted" \
                >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # ---- conflict fallback ------------------------------
            # Replay the resolution staging already performed:
            # merge main into the feature branch and resolve
            # conflicted paths with the staging squash commit's
            # versions.
            echo "  conflicted — replaying staging's resolution"
            merge_sha=$(gh pr view "$spr" --repo "$REPO" \
              --json mergeCommit -q .mergeCommit.oid)
            git fetch -q origin "$sha" "$merge_sha"
            git checkout -q -B "$branch" "$sha"
            if ! git merge -q --no-commit origin/main; then
              git diff --name-only --diff-filter=U | \
              while read -r p; do
                git checkout "$merge_sha" -- "$p" 2>/dev/null \
                  || git rm -q "$p"
              done
            fi
            git commit -q --no-edit || true
            git push -q origin "$branch"
            {
              echo "Auto-resolved: this branch conflicted with"
              echo "\`main\`. Conflicted paths were resolved"
              echo "with the versions from the staging squash"
              echo "commit \`$merge_sha\` — the integration"
              echo "state staging already validated. Merged"
              echo "with \`--admin\`: the new head SHA cannot"
              echo "satisfy \`staging-first\` by design."
            } > /tmp/note.md
            gh pr comment "$mpr" --body-file /tmp/note.md
            sleep 15
            if gh pr merge "$mpr" --squash --admin; then
              replayed=$((replayed+1))
              echo "- \`$title\` — promoted (staging replay)" \
                >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed+1))
              echo "- \`$title\` — FAILED" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(jq -r '.[] | @base64' /tmp/staged.json)

          # Post-release staging reset — refs API PATCH (admin
          # token bypasses the non-fast-forward ruleset).
          if [ "$DRY_RUN" != "true" ]; then
            main_sha=$(gh api "repos/$REPO/branches/main" \
              --jq .commit.sha)
            cur=$(gh api "repos/$REPO/branches/staging" \
              --jq .commit.sha)
            if [ "$cur" != "$main_sha" ]; then
              gh api -X PATCH \
                "repos/$REPO/git/refs/heads/staging" \
                -f sha="$main_sha" -F force=true > /dev/null
              echo "staging reset $cur -> $main_sha"
              echo "- staging reset to \`$main_sha\`" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "== done: $promoted merged, $skipped" \
            "already-in-main, $replayed replayed, $failed failed"
          [ "$failed" -eq 0 ]

name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors stay manual; minor/patch (incl. grouped PRs, where
      # update-type reports the highest bump in the group) auto-merge.
      - name: Wait for all checks to go green
        if: >
          steps.metadata.outputs.update-type !=
          'version-update:semver-major'
        run: |
          # Poll check runs directly: this job's own "automerge"
          # check appears on the PR, so `gh pr checks --watch`
          # would wait for itself forever. Also poll legacy
          # commit statuses (which never include check runs).
          sha=$(gh pr view "$PR_URL" --json headRefOid \
            -q .headRefOid)
          ok=0
          for i in $(seq 1 55); do
            res=$(gh api \
              "repos/$REPO/commits/$sha/check-runs" \
              --jq '[.check_runs[] | select(.name != "automerge")]
                    as $c |
                    if ($c | length) == 0 then "none"
                    elif ([$c[] | select(.status != "completed")]
                          | length) > 0 then "pending"
                    elif ([$c[] | select(.conclusion != "success"
                          and .conclusion != "skipped"
                          and .conclusion != "neutral")] | length)
                         > 0 then "failed"
                    else "passed" end')
            st=$(gh api "repos/$REPO/commits/$sha/statuses" \
              --jq 'if length == 0 then "none"
                    elif (map(select(.state == "error" or
                          .state == "failure")) | length) > 0
                    then "failed"
                    elif (map(select(.state == "pending"))
                          | length) > 0 then "pending"
                    else "passed" end')
            if [ "$res" = "failed" ] || [ "$st" = "failed" ]; then
              echo "A PR check failed"; exit 1
            fi
            if [ "$res" != "pending" ] && [ "$st" != "pending" ] \
               && { [ "$res" = "passed" ] \
                    || [ "$st" = "passed" ]; }; then
              ok=1; break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "Timed out waiting for checks"; exit 1
          fi

      - name: Approve PR
        if: >
          steps.metadata.outputs.update-type !=
          'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"

      - name: Squash merge
        if: >
          steps.metadata.outputs.update-type !=
          'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash

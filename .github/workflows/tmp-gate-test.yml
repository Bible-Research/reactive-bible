name: TMP gate test
on:
  push:
    branches:
      - ci/android-install-test
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL -o reactive-bible.apk \
            https://github.com/${{ github.repository }}/releases/download/continuous/reactive-bible.apk
      - uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: reactive-bible.apk
  install-test:
    needs: build
    uses: ./.github/workflows/android-install-test.yml
    with:
      apk_artifact: release-apk
      api_levels: '[33, 35]'

name: Android APK

# Debug APK: every push to the `android` working branch and every
# manual dispatch — the blind-development iteration artifact.
# Signed release APK: on `v*` tags, attached to the tag's GitHub
# release as `reactive-bible.apk` (fixed name keeps the download
# URL stable: releases/latest/download/reactive-bible.apk), and on
# every push to `main`, attached to the rolling `continuous`
# prerelease as a per-build `reactive-bible-<run_number>.apk` (plus
# the stable `reactive-bible.apk`), followed by `update.json` — the
# manifest installed apps poll to detect a newer build.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - android
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write to create the release + upload the APK.
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Capacitor 8 targets Java 21 / compileSdk 36.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK; setup-android@v3
      # is broken on new cmdline-tools (runs `sdkmanager tools`).
      - name: Install Android SDK components
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
            | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      # Skipped on main pushes — the signed release APK below is the
      # artifact that matters there.
      - name: Build debug APK
        if: github.ref != 'refs/heads/main'
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v5
        if: github.ref != 'refs/heads/main'
        with:
          name: reactive-bible-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ---------- Release (v* tags and main pushes) ----------

      - name: Build release APK
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == 'refs/heads/main'
        working-directory: android
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VNAME="${GITHUB_REF_NAME#v}"
          else
            VNAME="0.0.${{ github.run_number }}"
          fi
          echo "APP_VERSION_NAME=$VNAME" >> "$GITHUB_ENV"
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="$VNAME"

      # PKCS12 keystore (generated with openssl — no JKS needed);
      # signed with apksigner, which auto-detects the store type.
      - name: Sign release APK
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == 'refs/heads/main'
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | \
            base64 -d > release-key.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release \
            -name '*-unsigned.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks release-key.p12 \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out reactive-bible.apk \
            aligned.apk
          rm release-key.p12

      # Play Protect flagged sideloaded updates as harmful while the
      # background-mode plugin shipped a specialUse|microphone
      # service, a SIP-call FGS justification and the battery-
      # exemption permission. patches/ strips them — fail the build
      # if any return (e.g. a plugin bump the patch no longer fits).
      - name: Check APK for Play Protect red flags
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=reactive-bible.apk
          [ -f "$APK" ] || \
            APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml \
            "$APK" > manifest.txt
          FLAGS='SPECIAL_USE|IGNORE_BATTERY_OPTIMIZATIONS'
          FLAGS="$FLAGS|RECORD_AUDIO|FOREGROUND_SERVICE_MICROPHONE"
          if grep -E "$FLAGS" manifest.txt; then
            echo "::error::Play Protect red flag in APK manifest"
            exit 1
          fi

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: reactive-bible.apk

      # ---------- Rolling `continuous` channel (main only) ----------

      # Sanity check: the APK's real versionCode must equal the
      # run_number baked into update.json, or installed apps would
      # compare against a stale number.
      - name: Verify APK versionCode
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT="$BT/aapt"; [ -x "$AAPT" ] || AAPT="$BT/aapt2"
          VC=$("$AAPT" dump badging reactive-bible.apk | \
            sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          test "$VC" = "${{ github.run_number }}"

      # update.json points at a per-build asset name instead of the
      # reused `reactive-bible.apk`: re-uploading a fixed name deletes
      # it first, so a manifest read mid-publish could send phones a
      # 404 page / truncated file ("problem parsing the package").
      # Unique names also stop `reactive-bible (1).apk` duplicates
      # piling up in the phone's Downloads.
      - name: Create versioned APK copy
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          VAPK="reactive-bible-${{ github.run_number }}.apk"
          cp reactive-bible.apk "$VAPK"
          echo "VERSIONED_APK=$VAPK" >> "$GITHUB_ENV"

      - name: Generate update.json
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          APK_SHA=$(sha256sum "$VERSIONED_APK" | cut -d' ' -f1)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download"
          APK_URL="$BASE/continuous/$VERSIONED_APK"
          jq -n \
            --argjson versionCode "${{ github.run_number }}" \
            --arg versionName "$APP_VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg apkSha256 "$APK_SHA" \
            --argjson minShellBuild "${{ github.run_number }}" \
            --arg commitSha "${{ github.sha }}" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode: $versionCode, versionName: $versionName,
              apkUrl: $apkUrl, apkSha256: $apkSha256,
              minShellBuild: $minShellBuild, commitSha: $commitSha,
              releasedAt: $releasedAt}' > update.json
          cat update.json

      # Move the rolling tag so the release page shows the commit it
      # was built from.
      - name: Retag continuous
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f continuous "${{ github.sha }}"
          git push -f origin continuous

      # Fixed tag keeps the asset URL stable for the in-app updater:
      # releases/download/continuous/update.json. `prerelease` +
      # `make_latest: false` keep `releases/latest` pointing at real
      # v* milestones. Two ordered uploads: the APKs first, and only
      # once they are fully uploaded the manifest that points at
      # them. The stable `reactive-bible.apk` stays for old links
      # and manifests.
      - name: Publish continuous APKs
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build (main)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ${{ env.VERSIONED_APK }}
            reactive-bible.apk

      - name: Publish continuous update.json
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build (main)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: update.json

      # Keep only the newest few per-build APKs so the release does
      # not grow forever. Never touches the current build, the
      # stable reactive-bible.apk or update.json (the name filter
      # only matches reactive-bible-<digits>.apk). Non-fatal: the
      # build is already published when this runs.
      - name: Prune old versioned APKs
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: 5
        run: |
          set -eo pipefail
          gh release view continuous \
            --json assets --jq '.assets[].name' > assets.txt
          { grep -E '^reactive-bible-[0-9]+\.apk$' assets.txt \
            || true; } \
            | sed -E 's/^reactive-bible-([0-9]+)\.apk$/\1/' \
            | sort -rn | tail -n +"$((KEEP + 1))" > prune.txt
          while read -r N; do
            NAME="reactive-bible-$N.apk"
            if [ "$NAME" = "$VERSIONED_APK" ]; then
              continue
            fi
            echo "Deleting $NAME"
            gh release delete-asset continuous "$NAME" --yes || \
              echo "::warning::Could not delete $NAME"
          done < prune.txt

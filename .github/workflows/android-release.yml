name: Android APK

# Debug APK: every push to the `android` working branch and every
# manual dispatch — the blind-development iteration artifact.
# Signed release APK: on `v*` tags, attached to the tag's GitHub
# release as `reactive-bible.apk` (fixed name keeps the download
# URL stable: releases/latest/download/reactive-bible.apk), and on
# every push to `main`, attached to the rolling `continuous`
# prerelease together with `update.json` — the manifest installed
# apps poll to detect a newer build. Branch (non-main, non-tag)
# runs also publish the debug APK as `reactive-bible-debug.apk`
# on the rolling `media-debug` prerelease.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - android
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write to create the release + upload the APK.
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # main / v* tags build the release channel; every other ref
      # is a media-debug build (src/utils/mediaDebug.ts) tagged
      # `android-debug` in Sentry. GITHUB_ENV carries the choice
      # into `npm run build` below.
      - name: Select build channel
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || \
            [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VITE_APP_ENV=android" >> "$GITHUB_ENV"
          else
            echo "VITE_APP_ENV=android-debug" >> "$GITHUB_ENV"
            echo "VITE_MEDIA_DEBUG=1" >> "$GITHUB_ENV"
          fi

      # A missing VITE_SENTRY_DSN secret expands to '' and keeps
      # Sentry a no-op, exactly as before.
      - run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_RELEASE: ${{ github.sha }}
      - run: npx cap sync android

      # Capacitor 8 targets Java 21 / compileSdk 36.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK; setup-android@v3
      # is broken on new cmdline-tools (runs `sdkmanager tools`).
      - name: Install Android SDK components
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
            | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      # Skipped on main pushes — the signed release APK below is the
      # artifact that matters there.
      - name: Build debug APK
        if: github.ref != 'refs/heads/main'
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v5
        if: github.ref != 'refs/heads/main'
        with:
          name: reactive-bible-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ---------- Rolling `media-debug` channel (branches) ----------

      # Phone-downloadable copy of the debug APK (artifacts are
      # zipped and need a GitHub login). Its own tag and
      # prerelease: `continuous`, update.json and `latest` are
      # never touched from here.
      - name: Retag media-debug
        if: >-
          github.ref != 'refs/heads/main' &&
          github.ref_type != 'tag'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            reactive-bible-debug.apk
          git tag -f media-debug "${{ github.sha }}"
          git push -f origin media-debug

      - name: Publish media-debug release
        if: >-
          github.ref != 'refs/heads/main' &&
          github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-debug
          name: Media debug build
          prerelease: true
          make_latest: false
          body: >-
            Side-installable debug APK
            (com.bibleresearch.app.debug) with media-session
            diagnostics sent to Sentry (environment
            android-debug). Built from ${{ github.ref_name }}
            at ${{ github.sha }}.
          files: reactive-bible-debug.apk

      # ---------- Release (v* tags and main pushes) ----------

      - name: Build release APK
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == 'refs/heads/main'
        working-directory: android
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VNAME="${GITHUB_REF_NAME#v}"
          else
            VNAME="0.0.${{ github.run_number }}"
          fi
          echo "APP_VERSION_NAME=$VNAME" >> "$GITHUB_ENV"
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="$VNAME"

      # PKCS12 keystore (generated with openssl — no JKS needed);
      # signed with apksigner, which auto-detects the store type.
      - name: Sign release APK
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == 'refs/heads/main'
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | \
            base64 -d > release-key.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release \
            -name '*-unsigned.apk' | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks release-key.p12 \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out reactive-bible.apk \
            aligned.apk
          rm release-key.p12

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: reactive-bible.apk

      # ---------- Rolling `continuous` channel (main only) ----------

      # Sanity check: the APK's real versionCode must equal the
      # run_number baked into update.json, or installed apps would
      # compare against a stale number.
      - name: Verify APK versionCode
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT="$BT/aapt"; [ -x "$AAPT" ] || AAPT="$BT/aapt2"
          VC=$("$AAPT" dump badging reactive-bible.apk | \
            sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          test "$VC" = "${{ github.run_number }}"

      - name: Generate update.json
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          APK_SHA=$(sha256sum reactive-bible.apk | cut -d' ' -f1)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download"
          APK_URL="$BASE/continuous/reactive-bible.apk"
          jq -n \
            --argjson versionCode "${{ github.run_number }}" \
            --arg versionName "$APP_VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg apkSha256 "$APK_SHA" \
            --argjson minShellBuild "${{ github.run_number }}" \
            --arg commitSha "${{ github.sha }}" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode: $versionCode, versionName: $versionName,
              apkUrl: $apkUrl, apkSha256: $apkSha256,
              minShellBuild: $minShellBuild, commitSha: $commitSha,
              releasedAt: $releasedAt}' > update.json
          cat update.json

      # Move the rolling tag so the release page shows the commit it
      # was built from.
      - name: Retag continuous
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f continuous "${{ github.sha }}"
          git push -f origin continuous

      # Fixed tag keeps the asset URL stable for the in-app updater:
      # releases/download/continuous/update.json. `prerelease` +
      # `make_latest: false` keep `releases/latest` pointing at real
      # v* milestones.
      - name: Publish continuous release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build (main)
          prerelease: true
          make_latest: false
          files: |
            reactive-bible.apk
            update.json
